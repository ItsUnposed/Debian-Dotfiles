# ============ Picom / Chroma ============
backend = "glx";
vsync = true;
glx-no-stencil = true;
unredir-if-possible = false;
detect-client-opacity = true;
frame-opacity = 1.0;

# --- Ecken ---
corner-radius = 4;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "class_g = 'xfce4-panel'"
];

# --- Schatten ---
shadow = true;
shadow-radius = 10;
shadow-offset-x = -15;
shadow-offset-y = -12;
shadow-opacity = 0.4;
shadow-exclude = [
    "class_g = 'matrix-xterm'",
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- Fading aus: wuerde den Swipe ueberlagern ---

blur-background-exclude = [
    "class_g = 'matrix-xterm'",
    "class_g = 'XTerm'",
    "name = 'Matrix'"
];

wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 0.9; focus = true; };
  popup_menu    = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
  utility       = { opacity = 1.0; };
};

rules = (
  # ---------- aus den alten *-exclude uebernommen ----------
  { match = "window_type = 'dock'";        corner-radius = 0; shadow = false; },
  { match = "class_g = 'xfce4-panel'";     corner-radius = 0; shadow = false; },
  { match = "class_g = 'matrix-xterm'";    shadow = false; blur-background = false; },
  { match = "class_g = 'XTerm'";           blur-background = false; },
  { match = "name = 'Matrix'";             blur-background = false; },
  { match = "name = 'Notification'";       shadow = false; },
  { match = "window_type = 'popup_menu'";  opacity = 1.0; },
  { match = "window_type = 'dropdown_menu'"; opacity = 1.0; },
  { match = "window_type = 'utility'";     opacity = 1.0; },

  # ---------- Deckkraft (Werte jetzt 0..1 statt 0..100) ----------
  { match = "name = 'taskmanager'";        opacity = 0.55; },
  { match = "name = 'Matrix'";             opacity = 0.48; },
  { match = "class_g = 'matrix-xterm'";    opacity = 0.48; },
  { match = "name = 'Debian'";             opacity = 0.70; },
  { match = "name = 'i3-config'";          opacity = 0.70; },
  { match = "class_g = 'CavaSolo'";        opacity = 0.55; shadow = false; },
  { match = "class_g = 'qterminal'";       opacity = 0.82; },
  { match = "class_g = 'Rofi'";            opacity = 0.95; },


  # ---------- Richtung 1: klein -> gross (alt nach links, neu von rechts) ----------
  {
    match = "_MY_CUSTOM_WORKSPACE_SWITCH@ = 1";
    animations = (
      {
        triggers = [ "show", "open" ];
        offset-x = { curve = "cubic-bezier(0.22,1,0.36,1)"; duration = 1.00;
                     start = "1920"; end = "0"; };
        shadow-offset-x = "offset-x";
        opacity = { curve = "linear"; duration = 1.00;
                    start = "window-raw-opacity";
                    end   = "window-raw-opacity"; };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
      },
      {
        triggers = [ "hide" ];
        offset-x = { curve = "cubic-bezier(0.22,1,0.36,1)"; duration = 0.45;
                     start = "0"; end = "-1920"; };
        shadow-offset-x = "offset-x";
        opacity = { curve = "linear"; duration = 0.45;
                    start = "window-raw-opacity-before";
                    end   = "window-raw-opacity-before"; };
        blur-opacity = 0;
        shadow-opacity = "opacity";
      },
    );
  },

  # ---------- Richtung 2: gross -> klein (alt nach rechts, neu von links) ----------
  {
    match = "_MY_CUSTOM_WORKSPACE_SWITCH@ = 2";
    animations = (
      {
        triggers = [ "show", "open" ];
        offset-x = { curve = "cubic-bezier(0.22,1,0.36,1)"; duration = 1.00;
                     start = "-1920"; end = "0"; };
        shadow-offset-x = "offset-x";
        opacity = { curve = "linear"; duration = 1.00;
                    start = "window-raw-opacity";
                    end   = "window-raw-opacity"; };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
      },
      {
        triggers = [ "hide" ];
        offset-x = { curve = "cubic-bezier(0.22,1,0.36,1)"; duration = 0.45;
                     start = "0"; end = "1920"; };
        shadow-offset-x = "offset-x";
        opacity = { curve = "linear"; duration = 0.45;
                    start = "window-raw-opacity-before";
                    end   = "window-raw-opacity-before"; };
        blur-opacity = 0;
        shadow-opacity = "opacity";
      },
    );
  },
  # >>> chroma-swipe (managed by Chroma Control)
  # open = Fade in
  # close = Fade out
  # ws = Slide sideways
  # dur_open = 0.30
  # dur_close = 0.30
  # dur_ws = 1.00
  # distance = 60
  {
    animations = (
      {
        triggers = [ "open" ];
        opacity = { curve = "cubic-bezier(0.22,1,0.36,1)"; duration = 0.30; start = "0"; end = "window-raw-opacity"; };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
      },
      {
        triggers = [ "close" ];
        opacity = { curve = "cubic-bezier(0.22,1,0.36,1)"; duration = 0.30; start = "window-raw-opacity-before"; end = "0"; };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
      },
      {
        triggers = [ "workspace-in", "workspace-out" ];
        opacity = { curve = "cubic-bezier(0.22,1,0.36,1)"; duration = 1.00; start = "0"; end = "window-raw-opacity"; };
        offset-x = { curve = "cubic-bezier(0.22,1,0.36,1)"; duration = 1.00; start = "60"; end = "0"; };
        blur-opacity = "opacity";
        shadow-opacity = "opacity";
      },
    );
  },
  # <<< chroma-swipe
);
blur-strength = 5;
inactive-opacity = 1.00;
active-opacity = 1.00;

